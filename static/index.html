<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Neuron Attribution Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #ffffff;
            border-bottom: 2px solid #000000;
            padding: 0px 24px;
            flex-shrink: 0;
        }

        .header-content {
            max-width: 100%;
            display: flex;
            gap: 24px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        .header-section {
            flex: 1;
            min-width: 200px;
            padding-right: 24px;
            border-right: 1px solid #000000;
        }

        .container {
            flex: 1;
            display: flex;
            overflow: hidden;
            gap: 0;
        }

        .left-panel {
            flex: 1;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            padding: 24px;
            overflow-y: auto;
        }

        .right-panel {
            flex: 1;
            background: #ffffff;
            padding: 24px;
            overflow-y: auto;
        }

        h1 {
            color: #222;
            margin-bottom: 4px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .subtitle {
            color: #777;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .section {
            margin-bottom: 20px;
            padding: 12px 0;
        }

        .section-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="text"],
        textarea,
        select,
        input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d4d4d4;
            border-radius: 4px;
            font-size: 0.9rem;
            background: #fafafa;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #555;
            background: #ffffff;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
            font-family: 'Courier New', monospace;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }

        button:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }

        .status {
            padding: 6px 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: none;
            font-size: 0.8rem;
        }

        .status.success {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }

        .status.error {
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ffcdd2;
        }

        .status.info {
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #bbdefb;
        }

        .status.show {
            display: block;
        }

        #visualization {
            margin-top: 8px;
            padding: 16px;
            background: #fafafa;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            min-height: 200px;
            font-size: 0.9rem;
            word-wrap: break-word;
        }

        .token {
            display: inline-block;
            padding: 2px 4px;
            margin: 1px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #222;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 6px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .color-legend {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: #777;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid #ddd;
        }

        .neuron-blocks {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .neuron-block {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .neuron-block .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 2px;
            width: 18px;
            height: 18px;
            padding: 0;
            font-size: 12px;
            cursor: pointer;
            line-height: 1;
        }

        .neuron-block .remove-btn:hover {
            background: #cc0000;
        }

        .bias-table-container {
            margin-top: 16px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .bias-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: #ffffff;
        }

        .bias-table th {
            background: #f5f5f5;
            padding: 8px 10px;
            text-align: left;
            border-bottom: 2px solid #ddd;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .bias-table td {
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
        }

        .bias-table tr:hover {
            background: #f9f9f9;
        }

        .bias-table tr.clickable-row {
            cursor: pointer;
        }

        .bias-table tr.clickable-row:hover {
            background: #f0f0f0;
        }

        .bias-table tr.selected {
            background: #e3f2fd !important;
        }

        .bias-table tr:last-child td {
            border-bottom: none;
        }

        .bias-table .number-cell {
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        .bias-table .checkbox-cell {
            text-align: center;
            width: 40px;
        }

        .bias-table input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .concept-examples {
            margin-top: 16px;
            padding: 12px;
            background: #fafafa;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .concept-examples-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .example-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 4px solid;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .example-item.pos {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #1b5e20;
        }

        .example-item.neg {
            background: #ffebee;
            border-left-color: #f44336;
            color: #b71c1c;
        }

        .example-label {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        .clear-btn {
            background: #f5f5f5;
            border: 1px solid #ddd;
            color: #666;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }

        .clear-btn:hover {
            background: #e0e0e0;
            color: #333;
        }

        .label-with-clear {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title-with-clear {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1 style="margin: 0 0 12px 0; font-size: 1.5rem; color: #222;">LLM Neuron Attribution Tool</h1>
        <div class="header-content">
            <!-- Environment Section -->
            <div class="header-section">
                <div class="section-title" style="margin-bottom: 8px;">환경 설정 (CUDA)</div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label for="cudaDevices" style="font-size: 0.85rem;">CUDA_VISIBLE_DEVICES</label>
                    <input type="text" id="cudaDevices" placeholder="예: 0,1" value="0" style="font-size: 0.85rem; padding: 6px 8px;">
                    <div class="controls-row" style="margin-top: 4px;">
                        <button onclick="setEnv()" id="setEnvBtn" style="padding: 6px 12px; font-size: 0.85rem;">환경 적용</button>
                    </div>
                    <div id="envStatus" class="status"></div>
                </div>
            </div>

            <!-- Model Selection Section -->
            <div class="header-section">
                <div class="section-title" style="margin-bottom: 8px;">모델 선택 및 로드</div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label for="modelName" style="font-size: 0.85rem;">모델 이름 (HuggingFace model ID):</label>
                    <input type="text" id="modelName" placeholder="예: meta-llama/Meta-Llama-3.1-8B-Instruct" value="meta-llama/Meta-Llama-3.1-8B-Instruct" style="font-size: 0.85rem; padding: 6px 8px;">
                    <button onclick="loadModel()" id="loadModelBtn" style="margin-top: 4px; padding: 6px 12px; font-size: 0.85rem;">모델 로드</button>
                    <div id="modelStatus" class="status"></div>
                </div>
            </div>

            <!-- Neuron Selection Section -->
            <div class="header-section" style="flex: 1.5;">
                <div class="section-title-with-clear" style="margin-bottom: 8px;">
                    <span>뉴런 선택</span>
                    <button onclick="clearAllNeurons()" class="clear-btn" title="모든 뉴런 제거" id="clearNeuronsBtn" style="display: none;">🗑️ 초기화</button>
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label for="neuronPairInput" style="font-size: 0.85rem;">뉴런 (layer/neuron) 를 입력 후 Enter:</label>
                    <input
                        type="text"
                        id="neuronPairInput"
                        placeholder="예: 0/10  또는  27/10101"
                        style="font-size: 0.85rem; padding: 6px 8px;"
                    >
                    <small style="font-size: 0.75rem; color: #777;">
                        예: <code>0/10</code>, <code>5/32</code>, 여러 개를 차례대로 입력 (Enter 로 확정)
                    </small>
                    <div id="neuronBlocks" class="neuron-blocks"></div>
                    <div id="neuronStatus" class="status"></div>
                </div>
            </div>

            <!-- Bias Concept Load Section -->
            <div class="header-section" style="flex: 1.2;">
                <div class="section-title" style="margin-bottom: 8px;">편향 개념 Load</div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label for="biasConceptSelect" style="font-size: 0.85rem;">개념 선택:</label>
                    <select id="biasConceptSelect" style="font-size: 0.85rem; padding: 6px 8px;" disabled>
                        <option value="">먼저 모델을 로드하세요</option>
                    </select>
                    <button onclick="loadBiasConcept()" id="loadBiasBtn" disabled style="margin-top: 4px; padding: 6px 12px; font-size: 0.85rem;">로드</button>
                    <div id="biasStatus" class="status"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content: Left (Input) and Right (Visualization) -->
    <div class="container">
        <!-- Left Panel: Input -->
        <div class="left-panel">
            <div class="section">
                <div class="section-title-with-clear">
                    <span>입력 텍스트</span>
                    <button onclick="clearInputText()" class="clear-btn" title="텍스트 초기화">🗑️ 초기화</button>
                </div>
                <div class="form-group">
                    <label for="inputText">분석할 텍스트 입력:</label>
                    <textarea id="inputText" placeholder="분석하고 싶은 텍스트를 입력하세요...">안녕하세요. 오늘 날씨가 좋네요.</textarea>
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label for="methodSelect">방법 선택:</label>
                    <select id="methodSelect" style="font-size: 0.9rem; padding: 6px 8px; margin-bottom: 8px;">
                        <option value="activation_recording" selected>Activation Recording (기본)</option>
                        <option value="ig">Integrated Gradients (IG)</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <button onclick="computeAttribution()" id="computeBtn" disabled style="padding: 6px 12px; font-size: 0.9rem;">계산</button>
                    <div id="computeStatus" class="status"></div>
                </div>
            </div>

            <!-- Concept Examples Section -->
            <div class="section" id="conceptExamplesSection" style="display: none;">
                <div class="section-title">편향 개념 예시</div>
                <div id="conceptExamples" class="concept-examples"></div>
            </div>
        </div>

        <!-- Right Panel: Visualization -->
        <div class="right-panel">
            <div class="section">
                <div class="section-title">Attribution 시각화</div>
                <div id="visualization">
                    <p style="color: #999; text-align: center; padding: 40px 0;">Attribution을 계산하면 결과가 여기에 표시됩니다.</p>
                </div>
                <div id="methodInfo" style="margin-top: 8px; font-size: 0.8rem; color: #777; display: none;">
                    <strong>방법:</strong> <span id="currentMethod">-</span>
                </div>
                <div class="color-legend" id="legend" style="display: none; margin-top: 12px;">
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgb(255, 240, 200);"></div>
                        <span>낮은 기여도</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgb(255, 200, 100);"></div>
                        <span>중간 기여도</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgb(255, 140, 0);"></div>
                        <span>높은 기여도</span>
                    </div>
                </div>
            </div>

            <!-- Bias Concept TopK Table -->
            <div class="section" id="biasTableSection" style="display: none;">
                <div class="section-title">편향 개념 TopK 뉴런 통계</div>
                <div id="biasTableContainer" class="bias-table-container"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentModel = null;
        let currentLayerInfo = null;
        let selectedNeurons = [];  // Array of [layer, neuron] tuples
        let currentBiasTableData = null;  // Store current bias table data for score-based coloring

        async function setEnv() {
            const cuda = document.getElementById('cudaDevices').value.trim();
            const btn = document.getElementById('setEnvBtn');
            const payload = {};
            if (cuda) {
                payload.cuda_visible_devices = cuda;
            }

            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/set_env`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (response.ok) {
                    const note = data.has_loaded_model
                        ? ' (이미 로드된 모델에는 바로 적용되지 않을 수 있습니다.)'
                        : '';
                    showStatus('envStatus', `환경이 저장되었습니다.${note}`, 'success');
                } else {
                    showStatus('envStatus', `❌ 오류: ${data.detail || '알 수 없는 오류'}`, 'error');
                }
            } catch (error) {
                showStatus('envStatus', `❌ 오류: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function loadModel() {
            const modelName = document.getElementById('modelName').value.trim();
            if (!modelName) {
                showStatus('modelStatus', '모델 이름을 입력해주세요.', 'error');
                return;
            }

            const btn = document.getElementById('loadModelBtn');
            btn.disabled = true;
            btn.innerHTML = '로딩 중...<span class="loading"></span>';

            try {
                const response = await fetch(`${API_BASE}/api/load_model`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ model_name: modelName }),
                });

                const data = await response.json();
                
                if (response.ok) {
                    currentModel = modelName;
                    showStatus('modelStatus', `✅ 모델 로드 완료: ${modelName} (${data.num_layers} layers)`, 'success');
                    // 뉴런 입력 활성화
                    document.getElementById('neuronPairInput').disabled = false;
                    // 편향 개념 로드 활성화
                    await loadBiasConcepts();
                } else {
                    showStatus('modelStatus', `❌ 오류: ${data.detail || '알 수 없는 오류'}`, 'error');
                }
            } catch (error) {
                showStatus('modelStatus', `❌ 오류: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '모델 로드';
            }
        }

        function addNeuronFromString(input) {
            const trimmed = input.trim();
            if (!trimmed) return;

            // 허용 형식: "L/N" 또는 "L, N"
            let parts = [];
            if (trimmed.includes('/')) {
                parts = trimmed.split('/');
            } else if (trimmed.includes(',')) {
                parts = trimmed.split(',');
            } else {
                showStatus('neuronStatus', '형식은 layer/neuron 이어야 합니다. 예: 0/10', 'error');
                return;
            }

            if (parts.length !== 2) {
                showStatus('neuronStatus', '형식은 layer/neuron 이어야 합니다. 예: 0/10', 'error');
                return;
            }

            const layerIdx = parseInt(parts[0].trim(), 10);
            const neuronIdx = parseInt(parts[1].trim(), 10);

            if (Number.isNaN(layerIdx) || Number.isNaN(neuronIdx)) {
                showStatus('neuronStatus', 'layer와 neuron은 숫자여야 합니다. 예: 0/10', 'error');
                return;
            }

            const exists = selectedNeurons.some(n => n[0] === layerIdx && n[1] === neuronIdx);
            if (exists) {
                showStatus('neuronStatus', '이미 추가된 뉴런입니다.', 'error');
                return;
            }

            selectedNeurons.push([layerIdx, neuronIdx]);
            updateNeuronBlocks();
            showStatus('neuronStatus', `✅ 뉴런 추가: ${layerIdx}/${neuronIdx}`, 'success');
        }

        function removeNeuron(layerIdx, neuronIdx) {
            selectedNeurons = selectedNeurons.filter(n => !(n[0] === layerIdx && n[1] === neuronIdx));
            updateNeuronBlocks();
        }

        function getNeuronColor(layerIdx, neuronIdx, score = null) {
            // If score is provided, use orange gradient based on score strength
            if (score !== null && currentBiasTableData) {
                // Find max and min scores from current table data
                const scores = currentBiasTableData.neurons.map(n => n.score);
                const maxScore = Math.max(...scores);
                const minScore = Math.min(...scores);
                const scoreRange = maxScore - minScore || 1;
                
                // Normalize score to 0-1 range
                const normalized = (score - minScore) / scoreRange;
                
                // Orange gradient: from light orange (low score) to dark orange (high score)
                // HSL: Orange is around 30-40 degrees
                // Light orange: hsl(30, 100%, 85%) to Dark orange: hsl(25, 100%, 50%)
                const hue = 30 - (normalized * 5); // 30 to 25
                const saturation = 100;
                const lightness = 85 - (normalized * 35); // 85 to 50
                
                return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
            }
            
            // Fallback: Generate a consistent color based on layer and neuron indices
            const hash = (layerIdx * 1000000 + neuronIdx) % 360;
            const saturation = 60 + (layerIdx % 3) * 10; // 60-80%
            const lightness = 70 + (neuronIdx % 3) * 5; // 70-85%
            return `hsl(${hash}, ${saturation}%, ${lightness}%)`;
        }

        function getNeuronScore(layerIdx, neuronIdx) {
            if (!currentBiasTableData || !currentBiasTableData.neurons) {
                return null;
            }
            const neuron = currentBiasTableData.neurons.find(
                n => n.layer_idx === layerIdx && n.neuron_index === neuronIdx
            );
            return neuron ? neuron.score : null;
        }

        function updateNeuronBlocks() {
            const blocksDiv = document.getElementById('neuronBlocks');
            const clearBtn = document.getElementById('clearNeuronsBtn');
            
            if (selectedNeurons.length === 0) {
                blocksDiv.innerHTML = '';
                if (clearBtn) clearBtn.style.display = 'none';
                // Update compute button state
                document.getElementById('computeBtn').disabled = true;
                // Update table checkboxes and highlights
                updateTableSelection();
                return;
            }

            // Show clear button when neurons are selected
            if (clearBtn) clearBtn.style.display = 'inline-flex';

            let html = '';
            selectedNeurons.forEach(([layer, neuron]) => {
                const score = getNeuronScore(layer, neuron);
                const color = getNeuronColor(layer, neuron, score);
                html += `
                    <div class="neuron-block" style="background: ${color}; border-color: ${color}; color: #333;">
                        <span>${layer}/${neuron}</span>
                        <button class="remove-btn" onclick="removeNeuron(${layer}, ${neuron})" title="삭제">×</button>
                    </div>
                `;
            });
            blocksDiv.innerHTML = html;

            // Update compute button state
            document.getElementById('computeBtn').disabled = selectedNeurons.length === 0;
            
            // Update table checkboxes and highlights
            updateTableSelection();
        }

        function clearInputText() {
            document.getElementById('inputText').value = '';
            showStatus('computeStatus', '텍스트가 초기화되었습니다.', 'info');
        }

        function clearAllNeurons() {
            if (selectedNeurons.length === 0) {
                return;
            }
            selectedNeurons = [];
            updateNeuronBlocks();
            showStatus('neuronStatus', '모든 뉴런이 제거되었습니다.', 'info');
        }

        function updateTableSelection() {
            // Update checkboxes and row highlights in the bias table
            const table = document.querySelector('.bias-table');
            if (!table) return;

            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const checkbox = row.querySelector('input[type="checkbox"]');
                if (!checkbox) return;

                const layerIdx = parseInt(checkbox.dataset.layer);
                const neuronIdx = parseInt(checkbox.dataset.neuron);
                const isSelected = selectedNeurons.some(n => n[0] === layerIdx && n[1] === neuronIdx);

                checkbox.checked = isSelected;
                if (isSelected) {
                    row.classList.add('selected');
                } else {
                    row.classList.remove('selected');
                }
            });
        }

        async function computeAttribution() {
            if (!currentModel) {
                showStatus('computeStatus', '먼저 모델을 로드해주세요.', 'error');
                return;
            }

            if (selectedNeurons.length === 0) {
                showStatus('computeStatus', '최소 하나의 뉴런을 추가해주세요.', 'error');
                return;
            }

            const inputText = document.getElementById('inputText').value.trim();
            if (!inputText) {
                showStatus('computeStatus', '입력 텍스트를 입력해주세요.', 'error');
                return;
            }

            const btn = document.getElementById('computeBtn');
            btn.disabled = true;
            btn.innerHTML = '계산 중...<span class="loading"></span>';

            const vizDiv = document.getElementById('visualization');
            vizDiv.innerHTML = '<p style="color: #999; text-align: center;">계산 중...</p>';

            const method = document.getElementById('methodSelect').value;
            
            try {
                const response = await fetch(`${API_BASE}/api/compute_attribution`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model_name: currentModel,
                        input_text: inputText,
                        neurons: selectedNeurons,  // List of [layer, neuron] tuples
                        method: method  // "activation_recording" or "ig"
                    }),
                });

                const data = await response.json();
                
                if (response.ok) {
                    const neuronStr = selectedNeurons.map(n => `${n[0]}/${n[1]}`).join(', ');
                    const methodName = method === 'activation_recording' ? 'Activation Recording' : 'IG';
                    showStatus('computeStatus', 
                        `✅ ${methodName} 계산 완료 (${neuronStr})`, 
                        'success');
                    visualizeAttribution(data);
                } else {
                    showStatus('computeStatus', `❌ 오류: ${data.detail || '알 수 없는 오류'}`, 'error');
                    vizDiv.innerHTML = '<p style="color: #d00;">오류가 발생했습니다.</p>';
                }
            } catch (error) {
                showStatus('computeStatus', `❌ 오류: ${error.message}`, 'error');
                vizDiv.innerHTML = '<p style="color: #d00;">오류가 발생했습니다.</p>';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '계산';
            }
        }

        function visualizeAttribution(data) {
            const vizDiv = document.getElementById('visualization');
            const tokens = data.tokens;
            const attributions = data.attributions;
            const method = data.method || 'activation_recording';
            
            // Update method info
            const methodInfo = document.getElementById('methodInfo');
            const currentMethodSpan = document.getElementById('currentMethod');
            const methodName = method === 'activation_recording' ? 'Activation Recording' : 'Integrated Gradients (IG)';
            currentMethodSpan.textContent = methodName;
            methodInfo.style.display = 'block';
            
            // Find min and max for normalization
            const minAtt = Math.min(...attributions);
            const maxAtt = Math.max(...attributions);
            const range = maxAtt - minAtt || 1;

            let html = '<div style="line-height: 2.5;">';
            
            tokens.forEach((token, idx) => {
                const attr = attributions[idx];
                // Normalize to 0-1
                const normalized = (attr - minAtt) / range;
                
                // Create color based on attribution (orange gradient)
                // RGB: white (255, 255, 255) to dark orange (255, 140, 0)
                const r = 255;
                const g = Math.max(140, 255 - (255 - 140) * normalized);  // 255 -> 140
                const b = Math.max(0, 255 - 255 * normalized);  // 255 -> 0
                const color = `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
                const textColor = normalized > 0.5 ? 'white' : '#333';
                
                // Clean token for display
                const displayToken = token.replace('Ġ', ' ').replace('▁', ' ');
                
                const label = method === 'activation_recording' ? 'Activation' : 'Attribution';
                html += `<span class="token" style="background-color: ${color}; color: ${textColor};" 
                           title="${label}: ${attr.toFixed(4)}">${escapeHtml(displayToken)}</span>`;
            });
            
            html += '</div>';
            vizDiv.innerHTML = html;
            
            // Show legend
            document.getElementById('legend').style.display = 'flex';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function showStatus(elementId, message, type) {
            const statusEl = document.getElementById(elementId);
            statusEl.textContent = message;
            statusEl.className = `status ${type} show`;
            
            // Auto-hide after 5 seconds for success/info
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    statusEl.classList.remove('show');
                }, 5000);
            }
        }

        async function loadBiasConcepts() {
            if (!currentModel) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/get_bias_concepts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ model_name: currentModel }),
                });

                const data = await response.json();
                
                if (response.ok && data.concepts && data.concepts.length > 0) {
                    const select = document.getElementById('biasConceptSelect');
                    select.innerHTML = '<option value="">개념을 선택하세요</option>';
                    data.concepts.forEach(concept => {
                        const option = document.createElement('option');
                        option.value = concept;
                        option.textContent = concept;
                        select.appendChild(option);
                    });
                    select.disabled = false;
                    document.getElementById('loadBiasBtn').disabled = false;
                } else {
                    const select = document.getElementById('biasConceptSelect');
                    select.innerHTML = '<option value="">개념 데이터를 찾을 수 없습니다</option>';
                    select.disabled = true;
                    document.getElementById('loadBiasBtn').disabled = true;
                }
            } catch (error) {
                console.error('Error loading bias concepts:', error);
                const select = document.getElementById('biasConceptSelect');
                select.innerHTML = '<option value="">로드 실패</option>';
                select.disabled = true;
                document.getElementById('loadBiasBtn').disabled = true;
            }
        }

        async function loadBiasConcept() {
            const concept = document.getElementById('biasConceptSelect').value;
            if (!concept) {
                showStatus('biasStatus', '개념을 선택해주세요.', 'error');
                return;
            }

            if (!currentModel) {
                showStatus('biasStatus', '먼저 모델을 로드해주세요.', 'error');
                return;
            }

            const btn = document.getElementById('loadBiasBtn');
            btn.disabled = true;
            btn.innerHTML = '로딩 중...<span class="loading"></span>';

            try {
                // Load topK neurons
                const neuronResponse = await fetch(`${API_BASE}/api/get_topk_neurons`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model_name: currentModel,
                        concept: concept
                    }),
                });

                const neuronData = await neuronResponse.json();
                
                if (neuronResponse.ok) {
                    showStatus('biasStatus', `✅ ${concept} 개념 로드 완료 (${neuronData.neurons.length}개 뉴런)`, 'success');
                    displayBiasTable(neuronData);
                } else {
                    showStatus('biasStatus', `❌ 오류: ${neuronData.detail || '알 수 없는 오류'}`, 'error');
                }

                // Load concept examples
                try {
                    const exampleResponse = await fetch(`${API_BASE}/api/get_concept_examples`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            concept: concept
                        }),
                    });

                    const exampleData = await exampleResponse.json();
                    
                    if (exampleResponse.ok) {
                        displayConceptExamples(exampleData);
                    }
                } catch (error) {
                    console.error('Error loading concept examples:', error);
                    // Don't show error to user, just hide examples section
                    document.getElementById('conceptExamplesSection').style.display = 'none';
                }
            } catch (error) {
                showStatus('biasStatus', `❌ 오류: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '로드';
            }
        }

        function displayConceptExamples(data) {
            const container = document.getElementById('conceptExamples');
            const section = document.getElementById('conceptExamplesSection');
            
            if (!data.pos || !data.neg || (data.pos.length === 0 && data.neg.length === 0)) {
                section.style.display = 'none';
                return;
            }

            let html = `<div class="concept-examples-title">${data.concept} 예시</div>`;
            
            // Display positive examples (green)
            if (data.pos && data.pos.length > 0) {
                data.pos.forEach((example, index) => {
                    html += `
                        <div class="example-item pos">
                            <div class="example-label">Positive ${index + 1}</div>
                            <div>${escapeHtml(example)}</div>
                        </div>
                    `;
                });
            }
            
            // Display negative examples (red)
            if (data.neg && data.neg.length > 0) {
                data.neg.forEach((example, index) => {
                    html += `
                        <div class="example-item neg">
                            <div class="example-label">Negative ${index + 1}</div>
                            <div>${escapeHtml(example)}</div>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html;
            section.style.display = 'block';
        }

        function displayBiasTable(data) {
            const container = document.getElementById('biasTableContainer');
            const section = document.getElementById('biasTableSection');
            
            if (!data.neurons || data.neurons.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">뉴런 데이터가 없습니다.</p>';
                section.style.display = 'block';
                return;
            }

            // Store table data globally for score-based coloring
            currentBiasTableData = data;

            // Get score range for color normalization
            const scores = data.neurons.map(n => n.score);
            const maxScore = Math.max(...scores);
            const minScore = Math.min(...scores);
            const scoreRange = maxScore - minScore || 1;

            let html = '<table class="bias-table">';
            html += '<thead><tr>';
            html += '<th class="checkbox-cell">선택</th>';
            html += '<th>순위</th>';
            html += '<th>Layer</th>';
            html += '<th>Neuron</th>';
            html += '<th class="number-cell">Score</th>';
            html += '<th class="number-cell">Pos Mean</th>';
            html += '<th class="number-cell">Neg Mean</th>';
            html += '<th class="number-cell">Corr</th>';
            html += '<th class="number-cell">Pos Var</th>';
            html += '<th class="number-cell">Neg Var</th>';
            html += '</tr></thead><tbody>';

            data.neurons.forEach((neuron, index) => {
                const isSelected = selectedNeurons.some(n => n[0] === neuron.layer_idx && n[1] === neuron.neuron_index);
                const selectedClass = isSelected ? 'selected' : '';
                
                // Calculate color based on score (orange gradient)
                const normalized = (neuron.score - minScore) / scoreRange;
                const hue = 30 - (normalized * 5); // 30 to 25
                const saturation = 100;
                const lightness = 85 - (normalized * 35); // 85 to 50
                const rankColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                
                html += `<tr class="clickable-row ${selectedClass}" onclick="toggleNeuronRow(${neuron.layer_idx}, ${neuron.neuron_index})" title="클릭하여 선택/해제">`;
                html += `<td class="checkbox-cell" onclick="event.stopPropagation();">`;
                html += `<input type="checkbox" data-layer="${neuron.layer_idx}" data-neuron="${neuron.neuron_index}" ${isSelected ? 'checked' : ''} onchange="toggleNeuronFromTable(${neuron.layer_idx}, ${neuron.neuron_index}, this.checked)" onclick="event.stopPropagation();">`;
                html += `</td>`;
                html += `<td style="background: ${rankColor}; color: ${normalized > 0.5 ? 'white' : '#333'}; font-weight: 600; text-align: center; border-radius: 4px;">${index + 1}</td>`;
                html += `<td>${neuron.layer_idx}</td>`;
                html += `<td>${neuron.neuron_index}</td>`;
                html += `<td class="number-cell">${neuron.score.toFixed(6)}</td>`;
                html += `<td class="number-cell">${neuron.pos_mean.toFixed(6)}</td>`;
                html += `<td class="number-cell">${neuron.neg_mean.toFixed(6)}</td>`;
                html += `<td class="number-cell">${neuron.corr.toFixed(6)}</td>`;
                html += `<td class="number-cell">${neuron.pos_var.toFixed(6)}</td>`;
                html += `<td class="number-cell">${neuron.neg_var.toFixed(6)}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
            section.style.display = 'block';
            
            // Update neuron blocks to reflect new color scheme
            updateNeuronBlocks();
        }

        function toggleNeuronRow(layerIdx, neuronIdx) {
            const exists = selectedNeurons.some(n => n[0] === layerIdx && n[1] === neuronIdx);
            toggleNeuronFromTable(layerIdx, neuronIdx, !exists);
        }

        function toggleNeuronFromTable(layerIdx, neuronIdx, isChecked) {
            if (isChecked) {
                const exists = selectedNeurons.some(n => n[0] === layerIdx && n[1] === neuronIdx);
                if (!exists) {
                    selectedNeurons.push([layerIdx, neuronIdx]);
                    updateNeuronBlocks();
                    showStatus('neuronStatus', `✅ 뉴런 추가: ${layerIdx}/${neuronIdx}`, 'success');
                }
            } else {
                const index = selectedNeurons.findIndex(n => n[0] === layerIdx && n[1] === neuronIdx);
                if (index !== -1) {
                    selectedNeurons.splice(index, 1);
                    updateNeuronBlocks();
                    showStatus('neuronStatus', `뉴런 제거: ${layerIdx}/${neuronIdx}`, 'info');
                }
            }
        }

        // Initialize neuron input & compute button
        document.getElementById('neuronPairInput').disabled = true;
        document.getElementById('neuronPairInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addNeuronFromString(e.target.value);
                e.target.value = '';
            }
        });
        document.getElementById('computeBtn').disabled = true;
    </script>
